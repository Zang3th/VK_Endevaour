.btn[aria-pressed="true"] { border-color: var(--out); color: var(--out); }

.row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; position: relative; }

.art { margin-left: auto; color: var(--faint); }

  [...e.linkedBy, ...e.compiledInto].forEach(t => pick(`.tcard[data-target="${css(t)}"]`, "rel-in"));
  return [el("h2", { text: e.name }), e.description ? el("p", { text: e.description }) : null,
    kv([[L.kind, L[e.kind]], e.path && [L.path, e.path, "mono"]]),
    section("integration", integration(e), s => el("li", { text: s })),
    section(L.usedBy, users, p => el("li", {}, fileLink(p)), "tag-in")];
};

// ================================================================================================
// Ownership view
// ================================================================================================
const O = D.own;
const mods = O ? O.modules : {};
const modName = key => mods[key]?.name || base(key || "");
const fileModule = {};
for (const [key, m] of Object.entries(mods)) for (const f of m.files) fileModule[f] = key;
function moduleOfFile(path) { return fileModule[path] && mods[fileModule[path]].kind !== "data" ? fileModule[path] : null; }
const findingsOf = key => (O?.findings || []).filter(f => f.modules.includes(key));
const callers = {};
for (const [key, m] of Object.entries(mods)) for (const target of Object.keys(m.calls)) (callers[target] ||= []).push(key);
const borrowers = {};
for (const [key, m] of Object.entries(mods)) for (const b of m.borrows) (borrowers[b.target] ||= new Set()).add(key);

if (O) {
  LEGENDS.own = [
    swatch("", L.legendOwned, "sw box"), swatch("", L.legendLocal, "sw box dashed"),
    symbol("×2", " " + L.legendMult, "--lib"), symbol("#1", " " + L.legendOrder), symbol("⇢", " " + L.legendBorrow, "--out"),
    swatch("background: var(--out)", L.legendOut), swatch("background: var(--in)", L.legendIn),
    symbol("⚠", " " + L.legendFinding, "--err")];
  const tabs = document.getElementById("tabs");
  tabs.hidden = false;
  for (const [view, label] of [["layers", L.tabLayers], ["own", L.tabOwn]])
    tabs.append(el("button", { class: "tab", role: "tab", "data-tab": view, onclick: () => { resetPanel(); showView(view); }, text: label }));

  const root = document.getElementById("own");

  // One card width for the whole tree: the widest module name on one line, capped so five levels fit
  ON_SHOW.own = () => {
    if (root.style.getPropertyValue("--node-w")) return;
    const names = $$("#own .onode .oname").filter(n => n.offsetWidth);
    if (!names.length) return;
    names.forEach(n => { n.style.whiteSpace = "nowrap"; });
    const widest = Math.max(...names.map(n => n.scrollWidth));
    names.forEach(n => { n.style.whiteSpace = ""; });
    root.style.setProperty("--node-w", `${Math.min(200, Math.max(150, widest + 30))}px`);   // + padding, border, toggle
  };
  const instances = {};   // module -> [{node element, parent module, edge}]

  function relText(edge) {
    if (!edge) return null;
    if (edge.rel === "local" || edge.rel === "new")
      return el("span", {}, "◌ ", el("b", { text: `${edge.func}()` }), ` · ${edge.rel === "new" ? "new" : edge.via}`);
    return el("span", {}, edge.rel === "share" ? "◇ " : "◆ ", el("b", { text: edge.via }), edge.order ? el("span", { class: "order", text: `#${edge.order}` }) : null);
  }
  const treeLines = [];   // { from: parent card, to: child card }
  function nodeEl(n, parent, isRoot, parentCard = null) {
    const m = mods[n.module] || { name: base(n.module), handles: [], data: [], borrows: [] };
    const edge = n.edge;
    const local = edge && (edge.rel === "local" || edge.rel === "new");
    const warn = findingsOf(n.module).length > 0;
    const info = [];
    if (m.handles?.length) info.push(L.handleCount(m.handles.length));
    const borrowsTxt = [...new Set((m.borrows || []).map(b => modName(b.target)))];
    const card = el("div", { class: `onode${local ? " local" : ""}${isRoot ? " root" : ""}${warn ? " warn" : ""}`, "data-mod": n.module,
        title: m.description || "", onclick: onSelect("mod", n.module) },
      el("div", { class: "orel" }, isRoot ? el("span", {}, "✱ ", el("b", { text: "main()" }), ` · ${L.entry}`) : relText(edge)),
      el("div", { class: "oname" }, el("span", { text: camelBreak(modName(n.module)) }),
        edge && edge.mult && edge.mult !== "1" ? el("span", { class: "mult", text: `×${edge.mult}` }) : null,
        n.recursive ? el("span", { class: "mult", text: `↺ ${L.recursive}` }) : null,
        m.kind === "static" ? el("span", { class: "flag", title: L.kindLabel.static, text: "⏚" }) : null,
        warn ? el("span", { class: "flag", style: "color: var(--err)", text: "⚠" }) : null),
      m.description ? el("div", { class: "odesc", text: m.description }) : null,
      info.length || borrowsTxt.length ? el("div", { class: "oinfo" }, info.join(" · "),
        borrowsTxt.length ? el("span", { class: "borrow", text: `${info.length ? " · " : ""}⇢ ${borrowsTxt.join(", ")}` }) : null) : null);
    (instances[n.module] ||= []).push({ card, parent, parentCard, edge });
    if (parentCard) treeLines.push({ from: parentCard, to: card, style: "tree", color: "--wire", arrow: false, dashed: local });
    const li = el("li", {}, card);
    if (n.children.length) {
      const toggle = el("button", { class: "otoggle", text: "−", title: String(n.children.length) });
      toggle.addEventListener("click", e => { e.stopPropagation(); li.classList.toggle("collapsed");
        toggle.textContent = li.classList.contains("collapsed") ? `+${n.children.length}` : "−"; redraw(); });
      card.append(toggle);
      li.append(el("ul", {}, n.children.map(c => nodeEl(c, n.module, false, card))));
    }
    return li;
  }

  for (const r of O.roots) {
    const head = el("div", { class: "oroot-head" }, el("span", { class: "sym", style: "color: var(--exe)", text: "✱" }),
      el("span", { class: "tname", text: targets[r.target]?.label || r.target }),
      r.main ? el("span", { class: "mono muted", text: `main() · ${r.main.file}` }) : null);
    if (!r.main) { root.append(el("div", {}, head, el("div", { class: "note", text: L.noMain }))); continue; }
    const canvas = el("div", { class: "ocanvas" }, el("svg", { class: "overlay", "aria-hidden": "true" }),
      el("div", { class: "otree" }, el("ul", {}, nodeEl({ module: r.main.module, edge: { file: r.main.file }, children: r.children }, null, true))));
    root.append(el("div", {}, head, el("div", { class: "oroot-wrap" }, canvas)));
  }

  // Bands: modules outside the trees, grouped by kind
  const bandOf = { static: L.bandStatic, stateless: L.bandStateless, uninstanced: L.bandUninstanced };
  for (const kind of ["static", "stateless", "uninstanced"]) {
    const keys = O.bands[kind] || [];
    if (!keys.length) continue;
    root.append(el("div", { class: "mini-group" }, el("h3", { class: "group-title", text: bandOf[kind] }),
      el("div", { class: "mini-list" }, keys.map(key => {
        const m = mods[key];
        const lc = m.lifecycle;
        const facts = [];
        // Lifecycle in one phrase: "Init/Shutdown ← VulkanContext" when one class does both
        const verb = list => list[0].call.split("::").pop();
        const owners = list => [...new Set(list.map(s => s.caller.split("::")[0]))].join(", ");
        if (lc.startedBy.length && lc.stoppedBy.length && owners(lc.startedBy) === owners(lc.stoppedBy))
          facts.push(`${verb(lc.startedBy)}/${verb(lc.stoppedBy)} ← ${owners(lc.startedBy)}`);
        else {
          if (lc.startedBy.length) facts.push(`${verb(lc.startedBy)} ← ${owners(lc.startedBy)}`);
          if (lc.stoppedBy.length) facts.push(`${verb(lc.stoppedBy)} ← ${owners(lc.stoppedBy)}`);
        }
        if (!facts.length && (callers[key] || []).length) facts.push(`${L.calledBy} ${plural(callers[key].length, "module")}`);
        const warn = findingsOf(key).length > 0;
        return el("div", { class: "mini" + (warn ? " unused" : ""), "data-mod": key, onclick: onSelect("mod", key),
            style: `--accent: var(${kind === "static" ? "--shared" : kind === "stateless" ? "--iface" : "--warn"})` },
          el("div", { class: "en" }, el("span", { text: (warn ? "⚠ " : "") + modName(key) }), el("span", { class: "tag", text: m.target || "" })),
          m.description ? el("div", { class: "ed", text: m.description }) : null,
          facts.length ? el("div", { class: "ei", text: facts.join(" · ") }) : null);
      }))));
  }

  // Findings section
  const fs = document.getElementById("findings");
  fs.append(el("h2", { text: L.findings }), el("p", { class: "muted", style: "margin: -4px 0 10px; font-size: 12.5px", text: L.rules }),
    el("div", { class: "cards" }, O.findings.length ? O.findings.map(f =>
      el("div", { class: `card ${f.severity}`, onclick: onSelect("mod", f.modules[f.modules.length - 1]) },
        el("div", { text: (L.rule[f.rule] || (() => f.rule))(f) }),
        f.evidence.map(e => el("div", { class: "ev" }, fileLinkLine(e.path, e.line))))) :
      [el("div", { class: "card ok", text: "✓ " + L.noFindings(O.checks) })]),
    el("p", { class: "muted", style: "font-size: 12px; margin-top: 10px", text: L.stats(O) }));

  // Selection overlay: borrow and lifecycle lines from the selected module's instances
  overlays.push(() => {
    if (document.body.dataset.activeView !== "own") return;
    $$(".ocanvas").forEach(canvas => drawLines(canvas.querySelector(".overlay"), canvas,
      treeLines.filter(l => canvas.contains(l.to))));
  });

  SELECT.mod = key => {
    const m = mods[key];
    const own = instances[key] || [];
    own.forEach(i => i.card.classList.add("sel"));
    pick(`.mini[data-mod="${css(key)}"]`, "sel");
    const markMod = (k, cls) => { (instances[k] || []).forEach(i => i.card.classList.add(cls)); pick(`.mini[data-mod="${css(k)}"]`, cls); };
    const borrowed = [...new Set(m.borrows.map(b => b.target))];
    borrowed.forEach(k => markMod(k, "rel-out"));
    Object.keys(m.calls).forEach(k => markMod(k, "rel-out"));
    [...(borrowers[key] || [])].forEach(k => markMod(k, "rel-in"));
    (callers[key] || []).forEach(k => markMod(k, "rel-in"));
    for (const i of own) {
      for (const k of borrowed) for (const t of instances[k] || []) extraLines.push({ from: i.card, to: t.card, color: "--out", dashed: true });
      if (i.parentCard) highlights.push({ from: i.parentCard, to: i.card, color: "--in" });
      treeLines.filter(l => l.from === i.card).forEach(l => highlights.push({ from: l.from, to: l.to, color: "--out" }));
    }
    const lc = m.lifecycle;
    const first = mods[key].files.find(f => /\.(h|hh|hpp|hxx)$/.test(f)) || mods[key].files[0];
    const owners = own.filter(i => i.parent).map(i => `${modName(i.parent)} · ${i.edge.rel === "local" || i.edge.rel === "new" ? `${i.edge.func}()` : i.edge.via}${i.edge.mult && i.edge.mult !== "1" ? ` ×${i.edge.mult}` : ""}`);
    return [el("h2", { text: modName(key) }), m.files.map(f => el("p", {}, fileLink(f))),
      m.description ? el("p", { text: m.description }) : null,
      kv([[L.kind, L.kindLabel[m.kind] || m.kind], ["target", m.target], [L.types, m.records.map(r => r.name).join(", ")]]),
      section(L.instances, [...new Set(owners)], s => el("li", { class: "tag-in", text: s })),
      section(L.owns, m.owns, o => el("li", {}, el("span", { class: "mono", text: o.field }), ` → ${modName(o.target)}${o.mult !== "1" ? ` ×${o.mult}` : ""}${o.rel === "share" ? ` (${L.shared})` : ""}${o.order ? ` · #${o.order}` : ""}`)),
      section(L.borrows, m.borrows, b => el("li", { class: "tag-out" }, el("span", { class: "mono", text: b.field }), ` → ${modName(b.target)}`)),
      m.data.length ? section(L.data, m.data, d => el("li", {}, el("span", { class: "mono", text: d.field }), ` : ${short(d.targetRecord)}${d.mult !== "1" ? ` ×${d.mult}` : ""}`)) : null,
      m.handles.length ? section(L.handles, m.handles, h => el("li", {}, el("span", { class: "mono", text: h.field }), ` : ${h.handle}`)) : null,
      m.localData.length ? section(L.localData, m.localData, d => el("li", {}, `${d.func}(): `, el("span", { class: "mono", text: d.var }), ` : ${short(d.targetRecord)}`)) : null,
      m.static.length ? section(L.staticState, m.static, s => el("li", {}, el("span", { class: "mono", text: s.name }), ` : ${s.type}`)) : null,
      lc.startedBy.length || lc.stoppedBy.length ? section(L.lifecycle, [...lc.startedBy.map(s => [L.startedBy, s]), ...lc.stoppedBy.map(s => [L.stoppedBy, s])],
        ([label, s]) => el("li", {}, `${label} ${s.caller} `, fileLinkLine(s.file, s.line))) : null,
      section(L.calls, Object.entries(m.calls), ([k, names]) => el("li", { class: "tag-out" }, `${modName(k)}: `, el("span", { class: "mono", text: names.map(n => n.split("::").pop()).join(", ") }))),
      section(L.callers, callers[key] || [], k => el("li", { class: "tag-in", text: modName(k) })),
      findingsOf(key).length ? section(L.modFindings, findingsOf(key), f => el("li", { style: "color: var(--err)", text: (L.rule[f.rule] || (() => f.rule))(f) })) : null,
      first ? el("button", { class: "btn jump", onclick: onSelect("file", first), text: L.toLayers }) : null];
  };
}

// ================================================================================================
// Toolbar, footer, startup
// ================================================================================================
document.getElementById("footer").append(
  ...D.warnings.map(w => el("p", { style: "color: var(--warn)", text: "⚠ " + w })),
  ...(O?.warnings || []).map(w => el("p", { style: "color: var(--warn)", text: "⚠ " + w })));
{
  const tf = document.getElementById("toggle-files");
  tf.textContent = L.showFiles;
  tf.addEventListener("click", () => {
    const open = tf.getAttribute("aria-pressed") !== "true";
    tf.setAttribute("aria-pressed", String(open));
    fileLists.forEach(set => set(open));
    redraw();
  });
}
document.addEventListener("click", e => { if (!e.target.closest("#panel, .toolbar, .tabs, a")) resetPanel(); });

// Deep link: #dir=…, #file=…, #target=…, #ext=…, #mod=…, #view=own
{
  const hash = location.hash;
  showView("layers");
  resetPanel();
  const m = /^#(dir|file|target|ext|mod|view)=(.+)$/.exec(hash);
  const id = m && decodeURIComponent(m[2]);
  const known = m && ({ dir: !!$(`.block[data-path="${css(id)}"]`), file: id in files, target: id in targets,
    ext: D.externals.some(e => e.name === id), mod: id in mods, view: false })[m[1]];
  if (m && m[1] === "view") showView(id);
  else if (known) select(m[1], id);
}
</script>
</body>
</html>
